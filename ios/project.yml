name: FunctionGemmaRunner
options:
  bundleIdPrefix: com.arnis
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  FunctionGemmaRunner:
    type: application
    platform: iOS
    sources:
      - path: FunctionGemmaRunner
    settings:
      base:
        INFOPLIST_FILE: FunctionGemmaRunner/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.arnis.FunctionGemmaRunner
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
    postCompileScripts:
      - script: |
          if [ -f "${SRCROOT}/download_model.sh" ]; then
            echo "Model should be downloaded before building. Run ./download_model.sh"
          fi
        name: "Check Model"
